name: Automated Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
# Consumed by ./.github/actions/pushover in every job below; set once here so
# call sites only pass message content.
env:
  PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
  PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
jobs:
  build:
    uses: ./.github/workflows/build.yml
  release-please:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GH_TOKEN }}
      - run: "echo 'Outputs: ${{ toJSON(steps.release.outputs) }}'"
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      # With include-component-in-tag:false + linked-versions, release-please
      # emits a single set of release outputs under the first package (cf-worker).
      version: ${{ steps.release.outputs['cf-worker--tag_name'] }}
      release_url: ${{ steps.release.outputs['cf-worker--html_url'] }}
  docker-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/build-docker.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.version }}
  deploy-worker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.version }}
      release_url: ${{ needs.release-please.outputs.release_url }}
  notify-release:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Notify new version
        uses: ./.github/actions/pushover
        with:
          title: Hookbuffer ${{ needs.release-please.outputs.version }} released
          message: New version <b>${{ needs.release-please.outputs.version }}</b> has been released.
          url: ${{ needs.release-please.outputs.release_url }}
          url_title: View release notes

