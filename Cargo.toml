[workspace]
members = [
  "cf-worker",
  "standalone",
  "shared-lib"
]
resolver = "2"

[workspace.dependencies]
shared-lib = { path = "./shared-lib" }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["full"] }
worker = { version="0.8", features=['http', 'queue'] }
axum = "0.8.9"

